<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap"
      onload="this.onload=null;this.rel='stylesheet'">

<noscript>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&display=swap">
</noscript>

<link rel="stylesheet" href="{{ '/assets/logo.css' | relative_url }}">

  <header class="logo-body
  {% if include.variant %} logo-{{ include.variant }}{% endif %}
  {% if include.size %} logo-{{ include.size }}{% endif %}">

  <div class="logo-container">

    <a href="{{ '/' | relative_url }}"
       class="logo-link"
       aria-label="ŞahvMat - Dijital Satranç Dergisi">

      <span class="logo-main">
        <span class="logo-sah">Şah</span>
        <span class="logo-v">v</span>
        <span class="logo-mat">Mat</span>
      </span>

      <span class="logo-sub">
        <span class="tagline">DİJİTAL SATRANÇ DERGİSİ</span>
        <span class="logo-dot" aria-hidden="true"></span>
      </span>

    </a>

  </div>
</header>
