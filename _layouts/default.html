<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>
    {% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}
  </title>

  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
  
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
</head>
<body>

  <header id="site-logo"
  class="logo-body logo-large">
  {% include logo.html %}
  </header>

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}

  <div style="min-height:150vh;"></div>
  
<script>
  const logo = document.getElementById('site-logo');

  function handleScroll() {
    if (window.scrollY > 20) {
      logo.classList.add('is-scrolled');
    } else {
      logo.classList.remove('is-scrolled');
    }
  }

  window.addEventListener('scroll', handleScroll);
</script>
</body>
</html>
